<!doctype html>

<html lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="ad.size" content="width=320,height=50" />
  <title>Mastercard Threat Intelligence | 320x50</title>
  <link rel="stylesheet" type="text/css" href="style.css" />
  <script src="https://s0.2mdn.net/ads/studio/cached_libs/gsap_3.14.2_min.js"></script>
  <script type="text/javascript">
    var clickTag = "https://www.mastercard.com/in/en.html";
  </script>
</head>

<body onload="init()">
  <div id="main_container">
    <!--start main_container-->
    <div id="main_content">
      <div id="opening" class="layer">
        <img id="opening-lockup" class="art" src="images/opening-lockup.png" alt="Mastercard cybersecurity" width="38.5"
          height="24">
      </div>
      <div id="story" class="layer">
        <p id="story-copy" class="copy">
          Say <strong>YES</strong>
          to onboarding
          partners who<br>
          unlock new growth.
          Not new risk.
        </p>
      </div>
      <div id="closing" class="layer hidden">
        <img id="closing-lockup" class="art" src="images/closing-lockup.png" alt="Mastercard cybersecurity"
          width="151.5" height="24">
        <p id="priceless" class="copy hidden">
          <strong>Trust</strong> is priceless. For protecting<br>
          what matters, there’s <strong>Mastercard</strong>.
        </p>
      </div>
    </div>
    <div id="default_exit" class="btn"></div>
  </div>

  <script type="text/javascript" src="main.js"></script>

  <script type="text/javascript">
    document
      .getElementById("default_exit")
      .addEventListener("click", function () {
        window.open(clickTag, "_blank");
      });
  </script>
</body>

</html>
