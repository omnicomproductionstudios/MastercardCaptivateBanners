<!doctype html>

<html lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="ad.size" content="width=970,height=90" />
  <title>Mastercard Third-Party Risk Monitoring | 970x90</title>
  <link rel="stylesheet" type="text/css" href="style.css" />
  <script src="https://s0.2mdn.net/ads/studio/cached_libs/gsap_3.14.2_min.js"></script>
  <script type="text/javascript">
    var clickTag = "https://www.mastercard.com/in/en.html";
  </script>
</head>

<body onload="init()">
  <div id="main_container">
    <!--start main_container-->
    <div id="main_content">
      <div id="opening" class="layer">
        <img id="opening-lockup" class="art" src="images/opening-lockup.png" alt="Mastercard cybersecurity" width="300.5" height="47">
      </div>
      <div id="story" class="layer hidden">
        <div class="story-panel" aria-hidden="true"><div id="story-sprite"></div><div class="story-overlay"></div></div>
        <span class="story-disc left-disc" aria-hidden="true"></span><span class="story-disc right-disc" aria-hidden="true"></span>
        <p id="story-copy" class="copy hidden">
          Say <strong>YES</strong> to onboarding partners who<br>
          unlock new growth. Not new risk.
        </p>
      </div>
      <div id="closing" class="layer hidden">
        <img id="closing-lockup" class="art" src="images/closing-lockup.png" alt="Mastercard cybersecurity" width="74" height="46">
        <p id="priceless" class="copy hidden">
          <strong>Trust</strong> is priceless. For protecting what matters, there’s <strong>Mastercard</strong>.
        </p>
        <span id="cta" class="hidden">Learn more</span>
      </div>
      <div id="final" class="layer hidden">
        <svg id="final-symbol" class="hidden" viewBox="0 0 970 90" aria-hidden="true">
          <defs><clipPath id="final-red-clip"><circle class="final-red" cx="290.5" cy="45" r="23.5"/></clipPath></defs>
          <circle class="final-red" cx="290.5" cy="45" r="23.5" fill="#eb001b"/>
          <circle class="final-orange" cx="679.5" cy="45" r="23.5" fill="#f79e1b"/>
          <circle class="final-orange" cx="679.5" cy="45" r="23.5" fill="#ff5f00" clip-path="url(#final-red-clip)"/>
        </svg>
        <div id="final-wordmark" class="hidden"><img src="images/final-lockup.png" alt="Mastercard cybersecurity" width="300.5" height="47"></div>
        <span id="final-cta" class="hidden">Learn more</span>
      </div>
    </div>
    <div id="default_exit" class="btn"></div>
  </div>

  <script type="text/javascript" src="main.js"></script>

  <script type="text/javascript">
    document
      .getElementById("default_exit")
      .addEventListener("click", function () {
        window.open(clickTag, "_blank");
      });
  </script>
</body>

</html>
