<!doctype html>

<html lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="ad.size" content="width=300,height=250" />
  <title>Mastercard Third-Party Risk Monitoring | 300x250 Full Bleed | Version A</title>
  <link rel="stylesheet" type="text/css" href="style.css" />
  <script src="https://s0.2mdn.net/ads/studio/cached_libs/gsap_3.14.2_min.js"></script>
  <script type="text/javascript">
    var clickTag = "https://www.mastercard.com/in/en.html";
  </script>
</head>

<body onload="init()">
  <div id="main_container">
    <!--start main_container-->
    <div id="main_content">
      <div id="opening" class="layer">
        <img id="opening-lockup" class="art" src="images/logo.svg" alt="Mastercard cybersecurity" width="90" height="64">
      </div>
      <div id="story" class="layer hidden">
        <div id="story-sprite" aria-hidden="true"></div>
        <div class="story-gradient" aria-hidden="true"></div>
        <div class="story-overlay" aria-hidden="true">
          <span class="ui-scan"></span>
          <span class="ui-bars"></span>
        </div>
        <p id="story-copy" class="copy hidden">
          Say <strong>YES</strong><br>
          to onboarding<br>
          partners who<br>
          unlock new growth.<br>
          Not new risk.
        </p>
      </div>
      <div id="final" class="layer hidden">
        <svg id="final-symbol" viewBox="0 0 300 250" aria-hidden="true">
          <defs>
            <clipPath id="final-red-clip">
              <circle class="final-red" cx="-20.22" cy="123.22" r="20.22"/>
            </clipPath>
          </defs>
          <circle class="final-red" cx="-20.22" cy="123.22" r="20.22" fill="#eb001b"/>
          <circle class="final-orange" cx="320.22" cy="123.22" r="20.22" fill="#f79e1b"/>
          <circle class="final-orange" cx="320.22" cy="123.22" r="20.22" fill="#ff5f00" clip-path="url(#final-red-clip)"/>
        </svg>
        <div id="final-wordmark" class="hidden"><img src="images/logo.svg" alt="Mastercard cybersecurity" width="90" height="64"></div>
        <p id="final-heading" class="copy hidden"><strong>Trust</strong> is priceless. For protecting what<br>matters, there’s <strong>Mastercard</strong>.</p>
        <span id="final-cta" class="hidden">Learn more</span>
      </div>
    </div>
    <div id="default_exit" class="btn"></div>
  </div>

  <script type="text/javascript" src="main.js"></script>

  <script type="text/javascript">
    document
      .getElementById("default_exit")
      .addEventListener("click", function () {
        window.open(clickTag, "_blank");
      });
  </script>
</body>

</html>
