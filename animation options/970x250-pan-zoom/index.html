<!doctype html>

<html lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="ad.size" content="width=970,height=250" />
  <title>Mastercard Third-Party Risk Monitoring | 970x250</title>
  <link rel="stylesheet" type="text/css" href="style.css" />
  <script src="https://s0.2mdn.net/ads/studio/cached_libs/gsap_3.14.2_min.js"></script>
  <script type="text/javascript">
    var clickTag = "https://www.mastercard.com/in/en.html";
  </script>
</head>

<body onload="init()">
  <div id="main_container">
    <!--start main_container-->
    <div id="main_content">
      <div id="opening" class="layer">
        <svg class="opening-symbol" viewBox="0 0 970 250" aria-hidden="true">
          <defs><clipPath id="opening-red-clip"><circle class="opening-red" cx="-41.5" cy="124" r="41.5"/></clipPath></defs>
          <circle class="opening-red" cx="-41.5" cy="124" r="41.5" fill="#eb001b"/>
          <circle class="opening-orange" cx="1011.5" cy="124" r="41.5" fill="#f79e1b"/>
          <circle class="opening-orange" cx="1011.5" cy="124" r="41.5" fill="#ff5f00" clip-path="url(#opening-red-clip)"/>
        </svg>
        <img id="opening-lockup" class="art hidden" src="images/opening-lockup.png" alt="Mastercard cybersecurity" width="531.5" height="83">
      </div>
      <div id="story" class="layer hidden">
        <div class="story-panel" aria-hidden="true"><img id="story-photo" src="images/story-photo.jpg" alt="" width="970" height="250"><div class="story-gradient"></div><div class="story-ui"></div></div>
        <p id="story-copy" class="copy hidden">Say <strong>YES</strong> to onboarding partners who<br>unlock new growth. Not new risk.</p>
      </div>
      <div id="closing" class="layer hidden">
        <img id="closing-lockup" class="art" src="images/closing-lockup.png" alt="Mastercard cybersecurity" width="146" height="91">
        <p id="priceless" class="copy hidden">
          <strong>Trust</strong> is priceless. For protecting what<br>
          matters, there’s <strong>Mastercard</strong>.
        </p>
        <img id="final-lockup" class="art hidden" src="images/final-lockup.png" alt="Mastercard cybersecurity" width="531.5" height="83">
        <span id="cta" class="hidden">Learn more</span>
      </div>
    </div>
    <div id="default_exit" class="btn"></div>
  </div>

  <script type="text/javascript" src="main.js"></script>

  <script type="text/javascript">
    document
      .getElementById("default_exit")
      .addEventListener("click", function () {
        window.open(clickTag, "_blank");
      });
  </script>
</body>

</html>
