<!doctype html>

<html lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="ad.size" content="width=300,height=250" />
  <title>Mastercard Third-Party Risk Monitoring | 300x250 New Logo Animation</title>
  <link rel="stylesheet" type="text/css" href="style.css" />
  <script src="https://s0.2mdn.net/ads/studio/cached_libs/gsap_3.14.2_min.js"></script>
  <script type="text/javascript">
    var clickTag = "https://www.mastercard.com/in/en.html";
  </script>
</head>

<body onload="init()">
  <div id="main_container">
    <!--start main_container-->
    <div id="main_content">
      <div id="opening" class="layer">
        <div id="opening-wordmark">
          <img id="opening-lockup" src="images/logo.svg" alt="Mastercard cybersecurity" width="90" height="64">
        </div>
      </div>
      <div id="story" class="layer hidden">
        <img id="story-art" class="art" src="images/story-photo.jpg" alt="" width="300" height="250">
        <p id="story-copy" class="copy hidden">
          Say <strong>YES</strong><br>
          to onboarding<br>
          partners who<br>
          unlock new growth.<br>
          Not new risk.
        </p>
      </div>
      <div id="closing" class="layer hidden">
                <div id="closing-wordmark">
          <img id="closing-lockup" src="images/logo.svg" alt="Mastercard cybersecurity" width="90" height="64">
        </div>
        <p id="priceless" class="copy hidden">
          <strong>Trust</strong> is priceless. For protecting what<br>
          matters, there’s <strong>Mastercard</strong>.
        </p>
        <span id="cta" class="hidden">Learn more</span>
      </div>
    </div>
        <svg id="opening-symbol" viewBox="0 0 300 250" aria-hidden="true">
          <defs>
            <clipPath id="logo-red-clip"><circle class="logo-red" cx="150" cy="123.22" r="20.22"/></clipPath>
          </defs>
          <circle class="logo-red" cx="150" cy="123.22" r="20.22" fill="#eb001b"/>
          <circle class="logo-orange" cx="150" cy="123.22" r="20.22" fill="#f79e1b"/>
          <circle class="logo-orange" cx="150" cy="123.22" r="20.22" fill="#ff5f00" clip-path="url(#logo-red-clip)"/>
        </svg>
    <div id="default_exit" class="btn"></div>
  </div>

  <script type="text/javascript" src="main.js"></script>

  <script type="text/javascript">
    document
      .getElementById("default_exit")
      .addEventListener("click", function () {
        window.open(clickTag, "_blank");
      });
  </script>
</body>

</html>
