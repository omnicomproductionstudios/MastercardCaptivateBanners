<!doctype html>

<html lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="ad.size" content="width=300,height=600" />
  <title>Mastercard Third-Party Risk Monitoring | 300x600 Full Bleed | Version A</title>
  <link rel="stylesheet" type="text/css" href="style.css" />
  <script src="https://s0.2mdn.net/ads/studio/cached_libs/gsap_3.14.2_min.js"></script>
  <script type="text/javascript">
    var clickTag = "https://www.mastercard.com/in/en.html";
  </script>
</head>

<body onload="init()">
  <div id="main_container">
    <!--start main_container-->
    <div id="main_content">
      <div id="opening" class="layer">
        <div id="opening-wordmark"><img id="opening-lockup" src="images/logo.svg" alt="Mastercard cybersecurity"
            width="107" height="76.089"></div>
      </div>
      <div id="story" class="layer hidden">
        <div id="story-sprite" aria-hidden="true"></div>
        <div class="story-gradient" aria-hidden="true"></div>
        <!-- <div class="story-overlay" aria-hidden="true">
          <span class="ui-scan"></span>
          <span class="ui-bars"></span>
        </div> -->
        <p id="story-copy" class="copy hidden">
          Say <strong>YES</strong><br>
          to onboarding<br>
          partners who<br>
          unlock new growth.<br>
          Not new risk.
        </p>
      </div>
      <div id="final" class="layer hidden">
        <svg id="final-symbol" viewBox="0 0 300 600" aria-hidden="true">
          <defs>
            <clipPath id="final-red-clip">
              <circle class="final-red" cx="-24.039" cy="301.539" r="24.039" />
            </clipPath>
          </defs>
          <circle class="final-red" cx="-24.039" cy="301.539" r="24.039" fill="#eb001b" />
          <circle class="final-orange" cx="324.039" cy="301.539" r="24.039" fill="#f79e1b" />
          <circle class="final-orange" cx="324.039" cy="301.539" r="24.039" fill="#ff5f00"
            clip-path="url(#final-red-clip)" />
        </svg>
        <div id="final-wordmark" class="hidden"><img src="images/logo.svg" alt="Mastercard cybersecurity" width="107"
            height="76.089"></div>
        <p id="final-heading" class="copy hidden"><strong>Trust</strong> is priceless. For protecting what<br>matters,
          there’s <strong>Mastercard</strong>.</p>
        <span id="final-cta" class="hidden">Learn more</span>
      </div>
      <svg id="opening-symbol" viewBox="0 0 300 600" aria-hidden="true">
        <defs>
          <linearGradient id="moving-red" x1="0" y1="0" x2="0" y2="1">
            <stop class="red-stop" stop-opacity="1" stop-color="#eb001b" offset="0" />
            <stop class="red-stop red-fade" stop-opacity="1" stop-color="#eb001b" offset="1" />
          </linearGradient>
          <linearGradient id="moving-orange" x1="0" y1="1" x2="0" y2="0">
            <stop class="orange-stop" stop-opacity="1" stop-color="#f79e1b" offset="0" />
            <stop class="orange-stop orange-fade" stop-opacity="1" stop-color="#f79e1b" offset="1" />
          </linearGradient>
          <clipPath id="opening-red-clip">
            <circle class="opening-red" cx="134.889" cy="301.539" r="24.039" />
          </clipPath>
        </defs>
        <circle class="opening-red" cx="134.889" cy="301.539" r="24.039" fill="url(#moving-red)" />
        <circle class="opening-orange" cx="164.600" cy="301.539" r="24.039" fill="url(#moving-orange)" />
        <circle class="opening-orange opening-overlap" cx="164.600" cy="301.539" r="24.039" fill="#ff5f00"
          clip-path="url(#opening-red-clip)" />
      </svg>
    </div>
    <div id="default_exit" class="btn"></div>
  </div>

  <script type="text/javascript" src="main.js"></script>

  <script type="text/javascript">
    document
      .getElementById("default_exit")
      .addEventListener("click", function () {
        window.open(clickTag, "_blank");
      });
  </script>
</body>

</html>
