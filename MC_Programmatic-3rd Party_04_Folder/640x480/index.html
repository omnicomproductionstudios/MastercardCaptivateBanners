<!doctype html>

<html lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="ad.size" content="width=640,height=480" />
  <title>Mastercard Third-Party Risk Monitoring | 640x480</title>
  <link rel="stylesheet" type="text/css" href="style.css" />
  <script src="https://s0.2mdn.net/ads/studio/cached_libs/gsap_3.14.2_min.js"></script>
  <script type="text/javascript">
    var clickTag = "https://www.mastercard.com/in/en.html";
  </script>
</head>

<body onload="init()">
  <div id="main_container">
    <!--start main_container-->
    <div id="main_content">
      <div id="opening" class="layer">
        <img id="opening-lockup" class="art" src="images/opening-lockup.png" alt="Mastercard cybersecurity" width="234.5" height="167">
      </div>
      <div id="story" class="layer hidden">
        <img id="story-art" class="art" src="images/story-art.jpg" alt="" width="193.5" height="343">
        <p id="yes-copy" class="copy hidden">
          <strong>YES</strong> to<br>
          fast-tracking<br>
          new business<br>
          partners.
        </p>
        <p id="trust-copy" class="copy hidden">
          <strong>Trust</strong> you can<br>
          vet and verify<br>
          with <strong>third-</strong><br>
          <strong>party risk</strong><br>
          <strong>monitoring</strong>.
        </p>
      </div>
      <div id="closing" class="layer hidden">
        <img id="closing-lockup" class="art" src="images/opening-lockup.png" alt="Mastercard cybersecurity" width="234.5" height="167">
        <p id="priceless" class="copy hidden">
          <strong>Trust</strong> is priceless. For protecting what<br>
          matters, there’s <strong>Mastercard</strong>.
        </p>
        <span id="cta" class="hidden">Learn more</span>
      </div>
    </div>
    <div id="default_exit" class="btn"></div>
  </div>

  <script type="text/javascript" src="main.js"></script>

  <script type="text/javascript">
    document
      .getElementById("default_exit")
      .addEventListener("click", function () {
        window.open(clickTag, "_blank");
      });
  </script>
</body>

</html>
